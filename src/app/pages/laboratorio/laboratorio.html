<div class="page lab">
  <header class="page__header">
    <div>
      <h1 class="page__title">Laboratorio</h1>
      <p class="page__subtitle">Vista secundaria para validar enrutamiento + servicio.</p>
    </div>
    <span class="pill">Servicio activo</span>
  </header>

  <section class="lab__stats">
    <article class="lab__stat card card--flat">
      <h3>Total de personajes</h3>
      <p>{{ stats.total }}</p>
    </article>

    <article class="lab__stat card card--flat">
      <h3>Más conexiones</h3>
      <p>{{ stats.withMostRelations.name }}</p>
    </article>
  </section>

  <section class="card card--flat">
    <h2 class="section-title">Datos servidos desde CharacterService</h2>
    <ul class="lab__list">
      <li *ngFor="let character of characters">
        <strong>{{ character.name }}</strong>
        <span>{{ character.relations.length }} relaciones</span>
      </li>
    </ul>
  </section>
</div>
